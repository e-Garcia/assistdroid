[versions]
agp = "9.4.1"
kotlin = "2.2.21"
ktor = "3.6.0"
kotlinxSerialization = "1.7.3"
coroutines = "1.11.0"
junit = "4.13.2"
talsec = "19.3.1"
javamail = "1.6.7"
greenmail = "1.6.15"

[libraries]
talsec-freerasp = { module = "com.aheaditec.talsec.security:TalsecSecurity-Community", version.ref = "talsec" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
android-mail = { module = "com.sun.mail:android-mail", version.ref = "javamail" }
android-activation = { module = "com.sun.mail:android-activation", version.ref = "javamail" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# kotlin-android no longer needed with AGP 9.x (Kotlin integrated into AGP)
# kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
