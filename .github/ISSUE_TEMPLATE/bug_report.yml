name: Bug report
description: Something did not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Please **do not** paste API keys, tokens or personal data. Security problems: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The task you gave the agent (or the screen you were on) and what you did.
    validations: {required: true}
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8 emulator, Android 16 / Samsung Galaxy Z Fold 4, Android 14"
    validations: {required: true}
  - type: input
    id: build
    attributes:
      label: App version (commit)
      description: Shown in the diagnostics report under Environment.
  - type: textarea
    id: report
    attributes:
      label: Diagnostics report
      description: Settings > Developer > Share report (or Copy). Read it before posting; the default level has no screen or typed text.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed anything private from what I pasted.
          required: true
